[project]
name = "thingsboard-iot-chatbot"
version = "0.1.0"
description = "Async, tenant-safe ThingsBoard IoT chatbot backend"
requires-python = ">=3.12"
dependencies = [
  "aio-pika>=9.5", "aiosqlite>=0.20", "alembic>=1.14", "openai>=1.60",
  "asyncpg>=0.30", "fastapi>=0.115", "httpx>=0.28", "prometheus-client>=0.21",
  "pydantic>=2.10", "pydantic-settings>=2.7", "PyJWT>=2.10", "redis>=5.2",
  "sqlalchemy>=2.0", "sse-starlette>=2.2", "uvicorn[standard]>=0.34"
]

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "testcontainers[postgres,redis]>=4.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
